# SPEC 18: build the Nudgebox desktop app for Mac and Linux. A pull request that touches
# desktop/ builds it (and runs its Rust tests); a tag app-v<version> also publishes the
# builds as a GitHub Release.
name: Desktop app

on:
  push:
    tags: ["app-v*"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac-apple-silicon, os: macos-latest, target: aarch64-apple-darwin }
          - { name: mac-intel, os: macos-latest, target: x86_64-apple-darwin }
          - { name: linux-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/app-v')
        working-directory: desktop/src-tauri
        run: |
          v="${GITHUB_REF_NAME#app-v}"
          node -e 'const f="tauri.conf.json",c=JSON.parse(require("fs").readFileSync(f));c.version=process.argv[1];require("fs").writeFileSync(f,JSON.stringify(c,null,2))' "$v"

      - name: Rust tests
        if: matrix.target != 'x86_64-apple-darwin'
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Build
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.12.4 build --target ${{ matrix.target }} --ci

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          b=desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) cp $b/dmg/*.dmg "out/Nudgebox-mac-apple-silicon.dmg" ;;
            x86_64-apple-darwin)  cp $b/dmg/*.dmg "out/Nudgebox-mac-intel.dmg" ;;
            *) cp $b/appimage/*.AppImage "out/Nudgebox-linux-x86_64.AppImage"; cp $b/deb/*.deb "out/nudgebox_amd64.deb" ;;
          esac
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: nudgebox-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l out
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Nudgebox desktop ${GITHUB_REF_NAME#app-v}" \
            --notes-file desktop/RELEASE_NOTES.md
