<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab PRs</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lab PRs">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<style>
:root { --bg:#f6f8fa; --card:#fff; --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --accent:#0969da;
  --ok:#1a7f37; --bad:#cf222e; --warn:#9a6700; --chip:#eef1f4; }
@media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --card:#151b23; --fg:#e6edf3; --muted:#9198a1;
  --line:#3d444d; --accent:#4493f8; --ok:#3fb950; --bad:#f85149; --warn:#d29922; --chip:#212830; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
header { position:sticky; top:0; z-index:1; background:var(--bg); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:8px; padding:10px 16px; }
header h1 { font-size:17px; margin:0; flex:1; }
main { max-width:860px; margin:0 auto; padding:8px 16px 40px; }
button, .btn { font:inherit; font-size:13px; border:1px solid var(--line); background:var(--card); color:var(--fg);
  border-radius:8px; padding:6px 10px; cursor:pointer; text-decoration:none; white-space:nowrap; }
button.primary, .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button:disabled { opacity:.5; }
h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:22px 0 8px; }
h2 .n { background:var(--chip); border-radius:10px; padding:1px 8px; margin-left:6px; }
.pr { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px; }
.top { display:flex; gap:8px; align-items:baseline; }
.title { font-weight:600; flex:1; color:var(--fg); text-decoration:none; overflow-wrap:anywhere; }
.meta { color:var(--muted); font-size:13px; margin-top:4px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.chip { background:var(--chip); border-radius:10px; padding:1px 8px; font-size:12px; }
.chip.ok { color:var(--ok); } .chip.bad { color:var(--bad); } .chip.warn { color:var(--warn); }
.actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.empty { color:var(--muted); font-size:13px; padding:4px 2px 8px; }
.notice { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:16px; }
#toast { position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto;
  background:var(--fg); color:var(--bg); border-radius:10px; padding:10px 14px; display:none; }
</style>
</head>
<body>
<header>
  <h1>Lab PRs</h1>
  <button id="push" hidden>Turn on notifications</button>
  <button id="reload" aria-label="Refresh">↻</button>
</header>
<main id="main"><p class="empty">Loading…</p></main>
<div id="toast" role="status"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
