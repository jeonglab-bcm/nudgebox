[package]
name = "nudgebox"
version = "0.1.0"
description = "Nudgebox desktop app: the lab's GitHub inbox with native notifications (SPEC 18)"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-notification = "2.8.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
