<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nudgebox server</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --bg: #fff; --accent: #2f6fde; --bad: #c4314b; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; --bg: #1c1c1e; --accent: #6ea0ff; --bad: #ff6b81; } }
  body { margin: 0; padding: 24px; font: 15px/1.45 -apple-system, system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { margin: 0 0 16px; color: var(--muted); }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; font: 15px ui-monospace, monospace; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  #error { color: var(--bad); min-height: 1.4em; margin: 8px 0 0; }
</style>
<h1>Which Nudgebox?</h1>
<p>The address of your lab's Nudgebox. The Jeong Lab's is gh.bioinfolder.com.</p>
<form id="f">
  <label for="address">Server address</label>
  <input id="address" autocomplete="url" spellcheck="false" placeholder="review.example.org" autofocus>
  <p id="error" role="alert"></p>
  <div class="row"><button type="submit">Open</button></div>
</form>
<script>
  const { invoke } = window.__TAURI__.core;
  const box = document.getElementById("address");
  invoke("get_server").then((s) => { box.value = s.replace(/^https:\/\//, "").replace(/\/$/, ""); box.select(); });
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    document.getElementById("error").textContent = "";
    try { await invoke("set_server", { address: box.value }); } // the app restarts on the new server
    catch (err) { document.getElementById("error").textContent = String(err); }
  });
</script>
